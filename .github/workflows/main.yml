name: Build CrispASR (sm_61 + CUDA 11.8)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '14 8 */14 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      CUDA_VERSION: "11.8.0"
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v11.8"

    steps:
      - name: Checkout CrispASR
        uses: actions/checkout@v4
        with:
          repository: 'CrispStrobe/CrispASR'
          submodules: 'recursive'
          fetch-depth: 1

      - name: Get source SHA and current date
        id: get_source_sha
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          echo "SOURCE_SHA=$sha" >> $env:GITHUB_OUTPUT
          $date = Get-Date -Format "yyyy-MM-dd"
          echo "CURRENT_DATE=$date" >> $env:GITHUB_OUTPUT

      - name: Install Dependencies
        run: choco install ninja curl

      - name: Install CMake 3.27.7
        uses: jwlawson/actions-setup-cmake@v2
        with:
          version: 3.27.7

      - name: Install CUDA 11.8
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: 'network'
          sub-dir: false
          add-to-path: true

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Toolchain
        shell: cmd
        run: |
          cmake --version
          nvcc --version
          cl

      - name: Configure CMake
        shell: pwsh
        run: |
          $cxx_flags = "/EHsc /D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH /Dsetenv`(k`,v`,o`)=_putenv_s`(k`,v`) /Dunsetenv`(k`)=_putenv_s`(k`,\`"`\`")"
          
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_COMPRESS_FATBIN=OFF `
            -DCRISPASR_BUILD_SERVER=ON `
            -DCRISPASR_BUILD_CLI=ON `
            -DBUILD_TESTING=OFF `
            -DCRISPASR_BUILD_TESTS=OFF `
            -DGGML_BUILD_TESTS=OFF `
            -DCMAKE_CUDA_ARCHITECTURES=61 `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler -Xcompiler /D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" `
            "-DCMAKE_CXX_FLAGS=$cxx_flags"

      - name: Build Project
        shell: cmd
        run: cmake --build build --config Release --target crispasr-cli crispasr-server -j 8

      - name: Collect Binaries and Dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out

          Get-ChildItem -Path "build" -Recurse -Filter "*.exe" | Where-Object { 
              $_.Name -notlike "*CompilerId*" -and $_.Name -ne "a.exe" 
          } | Copy-Item -Destination "out\" -Force

          Get-ChildItem -Path "build" -Recurse -Filter "*.dll" | Copy-Item -Destination "out\" -Force

          Copy-Item "$env:CUDA_PATH\bin\cudart64_110.dll" "out\" -ErrorAction SilentlyContinue
          Copy-Item "$env:CUDA_PATH\bin\cublas64_11.dll" "out\" -ErrorAction SilentlyContinue
          Copy-Item "$env:CUDA_PATH\bin\cublasLt64_11.dll" "out\" -ErrorAction SilentlyContinue

          $ssldir = "C:\Program Files\OpenSSL-Win64\bin"
          if (Test-Path "$ssldir\libcrypto-3-x64.dll") {
              Copy-Item "$ssldir\libcrypto-3-x64.dll" "out\"
              Copy-Item "$ssldir\libssl-3-x64.dll" "out\"
          } else {
              $cryptoDll = Get-Command libcrypto-3-x64.dll -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
              if ($cryptoDll) {
                  $binDir = Split-Path $cryptoDll
                  Copy-Item "$binDir\libcrypto-3-x64.dll" "out\"
                  Copy-Item "$binDir\libssl-3-x64.dll" "out\"
              }
          }

          $vcruntimedir = "C:\Windows\System32"
          $vc_dlls = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          foreach ($dll in $vc_dlls) {
              if (Test-Path "$vcruntimedir\$dll") {
                  Copy-Item "$vcruntimedir\$dll" "out\" -ErrorAction SilentlyContinue
              }
          }

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path out\* -DestinationPath crispasr-sm61-cudart11.8.zip

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: crispasr-sm61-cudart11.8.zip
          tag_name: ${{ steps.get_source_sha.outputs.CURRENT_DATE }}
          target_commitish: ${{ github.sha }}
          name: "CrispASR cudart11.8 sm6.1 (${{ steps.get_source_sha.outputs.CURRENT_DATE }})"
          body: "Source repository commit: https://github.com/CrispStrobe/CrispASR/tree/${{ steps.get_source_sha.outputs.SOURCE_SHA }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
